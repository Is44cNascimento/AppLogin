<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #784dff;
      font-family: Arial, sans-serif;
    }
    .login-container {
      background: white;

      padding: 30px;
      border-radius: 30px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    input {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .login-button {
      background-color: #007bff;
      color: white;
      padding: 10px;
      border: none;
      width: 100%;
      border-radius: 5px;
      cursor: pointer;
    }
    .register-link {
      display: block;
      margin-top: 10px;
      color: #007bff;
      text-decoration: none;
    }
    .error-box {
      background-color: #f8d7da;
      color: #721c24;
      padding: 10px;
      border-radius: 5px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
<div class="login-container">
  <h2>Login</h2>

  <form id="login-form">
    <input id="email" name="email" type="text" placeholder="Digite seu e-mail" required>
    <input id="senha" name="senha" type="password" placeholder="Digite sua senha" required>
    <button class="login-button" type="submit">Entrar</button>
  </form>

  <a href="/cadastro" class="register-link">Registrar-se</a>

  <!-- Div para erro -->
  <div id="error-box" style="display:none; color: red; margin-top: 10px;">
    Erro ao processar o login
  </div>

  <script>
    document.getElementById("login-form").addEventListener("submit", function(event) {
      event.preventDefault(); // Impede recarregar

      const email = document.getElementById("email").value;
      const senha = document.getElementById("senha").value;
      const errorBox = document.getElementById("error-box");

      fetch("/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded",
        },
        body: `email=${encodeURIComponent(email)}&senha=${encodeURIComponent(senha)}`
      })
              .then(response => {
                if (response.status === 200) {
                  // Login OK, redireciona
                  window.location.href = "/perfilPrincipal";
                } else if (response.status === 401) {
                  // Login falhou
                  errorBox.style.display = "block";
                  errorBox.innerText = "Email ou senha incorretos!";
                } else {
                  errorBox.style.display = "block";
                  errorBox.innerText = "Erro inesperado. Tente novamente.";
                }
              })
              .catch(error => {
                console.error("Erro na requisição:", error);
                errorBox.style.display = "block";
                errorBox.innerText = "Erro de conexão com o servidor.";
              });
    });
  </script>


  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js" defer></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" defer></script>

</body>
</html>
