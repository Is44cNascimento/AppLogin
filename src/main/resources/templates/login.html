<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #6ec6d7;
      font-family: Arial, sans-serif;
    }
    .login-container {
      background: white;

      padding: 30px;
      border-radius: 30px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .login-button {
      background-color: #007bff;
      color: white;
      padding: 10px;
      border: none;
      width: 100%;
      border-radius: 5px;
      cursor: pointer;
    }
    .register-link {
      display: block;
      margin-top: 10px;
      color: #007bff;
      text-decoration: none;
    }
    .error-box {
      background-color: #f8d7da;
      color: #721c24;
      padding: 10px;
      border-radius: 5px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
<div class="login-container">
  <h2>Login</h2>
  <input type="text" placeholder="Digite seu nome de usuário">
  <input type="password" placeholder="Digite sua senha">
  <button class="login-button">Entrar</button>
  <a href="#" class="register-link">Registrar-se</a>
  <div class="error-box">Erro ao processar o login</div>
</div>
</body>
</html>
