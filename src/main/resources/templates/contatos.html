        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #000;
        }

        .container {
            display: flex;
            height: calc(100vh - 0px);

        }

        .sidebar {
            width: 70px;

            background-color: #8b3ff7;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
            gap: 20px;
            border-radius: 0 0 0 10px;
        }

        .sidebar div {

            width: 50px;
            height: 50px;
            border-radius: 4px;
        }

        .pink { background-color: #FF33B8; }
        .yellow { background-color: #FFC700; }
        .blue { background-color: #00CFFF; }
        .green { background-color: #3EFF00; }
        .red { background-color: #FF0000; border: 2px solid white; }


        .content {
            flex: 1;
            background-color: #B5B5B5;
            display: flex;
            flex-direction: column;
        }

        .header {
            height: 40px;
            background-color: #8B30EC;
            color: white;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: row;
        }

        .left, .right {
            width: 50%;
            padding: 40px 20px;
            position: relative;
        }

        .left h2, .right h2 {
            font-size: 36px;
            text-align: center;
            margin-bottom: 40px;
        }

        .left {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .button {
            background-color: #F7941D;
            color: black;
            font-weight: bold;
            padding: 10px;
            margin: 10px 0;
            width: 150px;
            text-align: center;
            text-decoration: none;
            display: block;
            border-radius: 4px;
        }

        .right {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .skills {
            display: grid;
            grid-template-columns: repeat(2, 80px);
            gap: 90px;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }

        .skills div {
            display: flex;
            flex-direction:column;
            align-items: center;
        }

        .skills img {
            height: 100px;
            object-fit:initial;
        }

        .skills span {
            margin-top: 5px;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
        }

        @media (max-width: 768px) {
            .main {
                flex-direction: column;
            }

            .left, .right {
                width: 100%;
                padding: 20px;
            }

            .skills {
                grid-template-columns: repeat(2, 80px);
            }
        }

        }
