<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #784dff;
        }
        .container {
            background: lightgrey;
            padding: 30px;
            padding-inline-end: 10px;
            padding-inline-start: 10px;
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            height: 300px;
            text-align: center;
        }
        input {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 90%;

            padding: 8px;
            margin: 8px 8px;
            border: 1px solid #ccc;
            border-radius: 4px;

        }
        .button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .button:hover {
            background-color: #0056b3;
        }
        a {
            display: block;
            margin-top: 10px;
            text-decoration: none;
            color: #007bff;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Cadastro</h2>
    <form method="post" action="/cadastroEnviarBanco">
        <input name="nome" id="nome" type="text" placeholder="Digite seu nome de usuário" required>
        <input name="email" id="email" type="email" placeholder="Digite seu e-mail" required>
        <input name="senha" id="senha" type="password" placeholder="Digite sua senha" required>
        <input name="confirmarSenha" id="confirmarSenha" type="password" placeholder="Confirme sua senha" required>

        <button type="submit" class="button">Cadastrar</button>
    </form>
    <script>
        document.querySelector("form").addEventListener("submit", function(event) {
            var senha = document.getElementById("senha").value;
            var confirmarSenha = document.getElementById("confirmarSenha").value;

            if (senha !== confirmarSenha) {
                alert("As senhas não coincidem.");
                event.preventDefault(); // Impede o envio do formulário
            }
        });
    </script>

    <a href="/">Voltar</a>
</div>

<!-- Scripts do Bootstrap -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js" defer></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" defer></script>


</body>
</html>
